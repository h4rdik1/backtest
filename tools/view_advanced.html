<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Advanced Dashboard</title>
    
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --bg-card: #151520;
            --accent: #3b82f6;
            --bull: #22c55e;
            --bear: #ef4444;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        body { margin: 0; background: var(--bg-deep); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { height: 60px; background: #111; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }
        .logo { font-weight: 700; color: var(--accent); letter-spacing: 1px; }

        .app-container { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR */
        aside {
            width: 320px;
            background: #0d0d14;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .side-tabs { display: flex; padding: 10px; gap: 8px; border-bottom: 1px solid var(--border); }
        .tab-btn {
            flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s; font-weight: 600;
        }
        .tab-btn.active { background: rgba(59, 130, 246, 0.1); border-color: var(--accent); color: white; }

        .side-scroll { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: thin; }

        .list-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
        }
        .list-card:hover { border-color: rgba(255,255,255,0.2); transform: translateX(3px); }
        .list-card.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }

        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .card-symbol { font-weight: 600; font-size: 0.95rem; }
        .side-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .tag-short { background: rgba(239, 68, 68, 0.1); color: var(--bear); }
        .tag-long { background: rgba(34, 197, 94, 0.1); color: var(--bull); }

        /* CHART AREA */
        main { flex: 1; position: relative; }
        #chartContainer { width: 100%; height: 100%; }

        #missing-lib-warning {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 15, 0.95); z-index: 1000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
        }
        .warning-box {
            max-width: 600px; background: #1a1a24; border: 1px solid #ef4444; 
            padding: 30px; border-radius: 12px;
        }
    </style>

    <!-- TRADINGVIEW SCRIPTS -->
    <script src="/charting_library/charting_library.standalone.js" onerror="showLibWarning()"></script>
    <script src="/datafeeds/udf/dist/bundle.js" onerror="showLibWarning()"></script>
</head>
<body>

    <div id="missing-lib-warning">
        <div class="warning-box">
            <h2 style="color:#ef4444">⚠️ Advanced Charts Library Missing</h2>
            <p>Please copy <code>charting_library/</code> and <code>datafeeds/</code> into your project root.</p>
            <button onclick="location.reload()" style="padding: 8px 20px; cursor: pointer;">I've copied the files</button>
        </div>
    </div>

    <header>
        <div class="logo">SMC ADVANCED DASHBOARD</div>
        <div style="margin-left: auto; font-size: 0.8rem; color: var(--text-dim);">TRADER: READY</div>
    </header>

    <div class="app-container">
        <aside>
            <div class="side-tabs">
                <button id="tab-open" class="tab-btn active" onclick="switchTab('open')">OPEN</button>
                <button id="tab-pending" class="tab-btn" onclick="switchTab('pending')">PENDING</button>
                <button id="tab-history" class="tab-btn" onclick="switchTab('history')">HISTORY</button>
            </div>
            <div class="side-scroll" id="sidebar-list">
                <!-- Trades populate here -->
            </div>
        </aside>

        <main>
            <div id="chartContainer"></div>
        </main>
    </div>

    <script>
        let tvWidget = null;
        let activeTrade = null;
        let sideTab = "open";
        let state = {};
        let closedTrades = [];
        let activeLines = [];

        function showLibWarning() {
            document.getElementById('missing-lib-warning').style.display = 'flex';
        }

        async function syncData() {
            try {
                const [sReq, tReq] = await Promise.all([fetch('/api/status'), fetch('/api/trades')]);
                state = await sReq.json();
                closedTrades = await tReq.json();
                renderSidebar();
            } catch (e) { console.error("Sync failed", e); }
        }

        function renderSidebar() {
            const list = document.getElementById('sidebar-list');
            list.innerHTML = '';
            let source = sideTab === 'open' ? (state.open_trades || []) : (sideTab === 'pending' ? (state.pending_trades || []) : closedTrades);

            if (!source.length) {
                list.innerHTML = `<div style="text-align:center;color:var(--text-dim);margin-top:20px;">No trades.</div>`;
                return;
            }

            source.forEach(t => {
                const card = document.createElement('div');
                card.className = `list-card ${activeTrade && activeTrade.trade_id === t.trade_id ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-symbol">${t.symbol}</div>
                        <div class="side-tag ${t.direction === 'LONG' ? 'tag-long' : 'tag-short'}">${t.direction}</div>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-dim)">@ ${t.entry_price.toLocaleString()}</div>
                `;
                card.onclick = () => selectTrade(t);
                list.appendChild(card);
            });
        }

        function switchTab(tab) {
            sideTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${tab}`));
            renderSidebar();
        }

        function selectTrade(t) {
            activeTrade = t;
            renderSidebar();
            if (tvWidget) {
                tvWidget.setSymbol(t.symbol, '15');
                renderTradeVisuals(t);
            }
        }

        function renderTradeVisuals(t) {
            if (!tvWidget || !t) return;
            
            tvWidget.onChartReady(() => {
                const chart = tvWidget.activeChart();
                
                // Clear old lines
                activeLines.forEach(l => l.remove());
                activeLines = [];

                try {
                    // 1. POSITION LINE (ENTRY)
                    const entryLine = chart.createPositionLine()
                        .setPrice(t.entry_price)
                        .setText("ENTRY")
                        .setLineColor("#3b82f6")
                        .setBodyBackgroundColor("rgba(59, 130, 246, 0.2)")
                        .setQuantity("1.0"); // Placeholder qty
                    activeLines.push(entryLine);

                    // 2. STOP LOSS LINE
                    const slLine = chart.createOrderLine()
                        .setPrice(t.sl_price)
                        .setText("STOP LOSS")
                        .setLineColor("#ef4444")
                        .setBodyBackgroundColor("rgba(239, 68, 68, 0.2)");
                    activeLines.push(slLine);

                    // 3. TAKE PROFIT LINE
                    const tpLine = chart.createOrderLine()
                        .setPrice(t.tp_price)
                        .setText("TAKE PROFIT")
                        .setLineColor("#22c55e")
                        .setBodyBackgroundColor("rgba(34, 197, 94, 0.2)");
                    activeLines.push(tpLine);
                } catch (err) {
                    console.warn("Visuals error (likely Charting Library vs Trading Platform difference):", err);
                }
            });
        }

        // INITIALIZE THE PRO WIDGET
        window.addEventListener('DOMContentLoaded', () => {
            syncData();
            setInterval(syncData, 30000);

            if (typeof TradingView === 'undefined') return;

            tvWidget = new TradingView.widget({
                container: 'chartContainer',
                locale: 'en',
                library_path: '/charting_library/',
                datafeed: new Datafeeds.UDFCompatibleDatafeed(window.location.origin),
                symbol: 'BTC/USDT',
                interval: '15',
                fullscreen: false,
                autosize: true,
                theme: 'Dark',
                style: '1',
                disabled_features: ["header_saveload"],
                overrides: {
                    "mainSeriesProperties.candleStyle.upColor": "#22c55e",
                    "mainSeriesProperties.candleStyle.downColor": "#ef4444",
                    "paneProperties.background": "#0a0a0f",
                }
            });
        });
    </script>
</body>
</html>
</body>
</html>
